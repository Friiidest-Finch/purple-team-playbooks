title: PowerShell Dijalankan dengan Encoded Command
id: 3f8a1c52-7b4e-4d19-9a6e-2c5d8e1f0b73
status: experimental
description: >
  Mendeteksi eksekusi PowerShell dengan parameter -EncodedCommand (atau singkatannya),
  yang sering dipakai untuk menyamarkan perintah. Bisa menimbulkan false positive
  dari tool admin/otomasi yang sah, jadi lakukan tuning.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: friiidest
date: 2026-11-13
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  condition: selection_img and selection_flags
falsepositives:
  - Software deployment / konfigurasi manajemen (SCCM, Intune, Ansible)
  - Script admin internal yang memakai encoded command
level: medium
